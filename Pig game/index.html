<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig Game UI</title>
    <!-- Importing Nunito font to match the clean aesthetic -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- RESET & BASE STYLES --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Nunito", sans-serif;
        font-weight: 400;
        height: 100vh;
        color: #333;
        /* Matches the diagonal purple-to-red gradient */
        background-image: linear-gradient(
          to top left,
          #753682 0%,
          #bf2e34 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      /* --- GAME CONTAINER --- */
      .game {
        position: relative;
        width: 100rem;
        max-width: 90%; /* Responsive width */
        background-color: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(200px); /* Glassmorphism effect */
        -webkit-backdrop-filter: blur(200px);
        border-radius: 9px;
        box-shadow: 0 3rem 5rem rgba(0, 0, 0, 0.25);
        overflow: hidden;
        display: flex;
        height: 60rem;
        max-height: 90vh; /* Ensure it fits on screen */
      }

      /* --- PLAYER SECTIONS --- */
      .player {
        flex: 50%;
        padding: 9rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: all 0.75s;
      }

      /* Styles for the "active" player panel */
      .player--active {
        background-color: rgba(255, 255, 255, 0.4);
      }

      .player--active .name {
        font-weight: 700;
      }

      .player--active .score {
        font-weight: 400;
      }

      .player--active .current {
        opacity: 1;
      }

      /* declaring winner */
      .winner {
        background-color: #d0a81d;
      }

      /* block button when win */
      .is-blocked {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Typography */
      .name {
        font-size: 4rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        word-spacing: 2px;
        font-weight: 400;
        margin-bottom: 1rem;
      }

      .score {
        font-size: 8rem;
        font-weight: 300;
        color: #c7365f;
        margin-bottom: auto; /* Pushes the current box to the bottom */
      }

      /* --- CURRENT SCORE BOX --- */
      .current {
        background-color: #c7365f;
        opacity: 0.8;
        border-radius: 9px;
        color: #fff;
        width: 65%;
        padding: 2rem;
        text-align: center;
        transition: all 0.75s;
      }

      .current-label {
        text-transform: uppercase;
        margin-bottom: 1rem;
        font-size: 1.7rem;
        color: #ddd;
      }

      .current-score {
        font-size: 3.5rem;
      }

      /* --- BUTTONS --- */
      .btn {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: #444;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(10px);
        border: none;
        font-family: inherit;
        font-size: 1.8rem;
        text-transform: uppercase;
        cursor: pointer;
        font-weight: 400;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;

        padding: 0.7rem 2.5rem;
        border-radius: 50rem;
        box-shadow: 0 1.75rem 3.5rem rgba(0, 0, 0, 0.1);
        z-index: 10; /* Keep above player panels */
      }

      .btn:hover {
        background-color: white;
      }

      .btn:active {
        transform: translate(-50%, 3px);
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15);
      }

      .btn:focus {
        outline: none;
      }

      /* Button Positions */
      .btn--new {
        top: 4rem;
      }

      .btn--roll {
        top: 39rem; /* Adjusted to sit below center line */
      }

      .btn--hold {
        top: 46rem;
      }

      /* --- DICE IMAGE --- */
      .dice {
        position: absolute;
        left: 50%;
        top: 16.5rem; /* Center vertically in the space between buttons */
        transform: translateX(-50%);
        height: 10rem;
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.2);
        border-radius: 1rem;
        /* Placeholder styling if no image is present */
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        color: #c7365f;
        display: block; /* Hidden by default until JS adds logic to show it */
      }

      /* --- SVG ICONS --- */
      .icon {
        width: 2.4rem;
        height: 2.4rem;
        fill: currentColor;
      }

      /* --- RESPONSIVE DESIGN --- */
      @media (max-width: 900px) {
        html {
          font-size: 50%; /* Scale down typography */
        }

        .game {
          width: 100%;
          max-width: 100%;
          height: 100vh;
          border-radius: 0;
        }

        .player {
          padding: 4rem;
        }

        .name {
          font-size: 3rem;
        }
      }

      @media (max-width: 600px) {
        /* On mobile, we stack the layout */
        .game {
          flex-direction: column;
          height: 100vh;
          max-height: none;
        }

        .player {
          width: 100%;
          flex: 1; /* Split height equally */
          flex-direction: row; /* Horizontal layout inside player card on mobile */
          justify-content: space-between;
          padding: 2rem 4rem;
          gap: 2rem;
        }

        .player:first-child {
          border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Adjust internal player layout for mobile strip */
        .player .name {
          font-size: 2.4rem;
          margin-bottom: 0;
        }

        .player .score {
          font-size: 5rem;
          margin-bottom: 0;
        }

        /* Hide the big current box on very small screens or restyle it */
        .current {
          width: auto;
          padding: 1rem 2rem;
          position: absolute;
          /* Move current score to a corner or overlay */
          right: 2rem;
          bottom: 2rem;
          display: flex;
          flex-direction: column;
          min-width: 80px;
        }

        /* Re-position buttons for stacked layout */
        .btn {
          position: relative; /* Remove absolute positioning */
          left: auto;
          transform: none;
          top: auto;
          margin: 1rem auto;
          width: 60%;
        }

        .btn:active {
          transform: translateY(2px);
        }

        /* We need a container for controls in mobile view */
        .controls-mobile-wrapper {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          display: flex;
          flex-direction: column;
          gap: 1rem;
          width: 100%;
          z-index: 20;
          align-items: center;
          pointer-events: none; /* Let clicks pass through transparent areas */
        }

        .controls-mobile-wrapper .btn {
          pointer-events: auto; /* Re-enable clicks on buttons */
          box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.2);
          background-color: rgba(255, 255, 255, 0.9);
          font-size: 1.4rem;
          padding: 0.8rem 1.5rem;
        }

        /* Hide the desktop absolute buttons to avoid conflict, 
               or use media queries to change the .btn class directly. 
               Here I'll just adjust the .btn class above. */

        /* Specific overrides for the buttons to center them on the seam */
        .btn--new {
          position: absolute;
          top: 2rem;
          width: auto;
        }
        .btn--roll {
          position: absolute;
          top: 45%;
        }
        .btn--hold {
          position: absolute;
          top: 55%;
          margin-top: 1rem;
        }

        /* On mobile, standard layout might be cleaner than the "split" overlay */
        /* Reverting to a simpler stacked look for clarity */
        .player {
          flex-direction: column;
          justify-content: center;
        }

        .current {
          position: static;
          width: 80%;
          margin-top: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <!-- Player 0 Section -->
      <!-- Add 'player--active' class to indicate whose turn it is -->
      <section class="player player--0 player--active">
        <h2 class="name" id="name--0">Player 1</h2>
        <p class="score" id="score--0">90</p>
        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--0">0</p>
        </div>
      </section>

      <!-- Player 1 Section -->
      <section class="player player--1">
        <h2 class="name" id="name--1">Player 2</h2>
        <p class="score" id="score--1">90</p>
        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--1">0</p>
        </div>
      </section>

      <!-- Game Controls -->
      <!-- Icons using simple SVG paths to avoid external deps/heavy loads -->

      <!-- Hidden Dice Image (Placeholder for JS) -->
      <!-- To show this, set display: block in JS or CSS -->
      <div class="dice">
        <!-- Simple CSS Dice representation or use an <img> -->
        0
      </div>

      <button class="btn btn--new">
        <svg class="icon" viewBox="0 0 24 24">
          <path
            d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"
          />
        </svg>
        New Game
      </button>

      <button class="btn btn--roll">
        <svg class="icon" viewBox="0 0 24 24">
          <path
            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.04 15.96c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0-6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm5 5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm5 1c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0-6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"
          />
        </svg>
        Roll Dice
      </button>

      <button class="btn btn--hold">
        <svg class="icon" viewBox="0 0 24 24">
          <path
            d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"
          />
        </svg>
        Hold
      </button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
